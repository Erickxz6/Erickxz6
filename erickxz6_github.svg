<!-- Capas traseras para generar el efecto 3D (Extrusión isométrica) -->
<!-- Mientras más lejos, más oscuro el azul -->
<text x="400" y="170" text-anchor="middle" class="layer-3d layer-3d-dark" transform="translate(-12, 12)">Erickxz6</text>
<text x="400" y="170" text-anchor="middle" class="layer-3d layer-3d-dark" transform="translate(-10, 10)">Erickxz6</text>

<text x="400" y="170" text-anchor="middle" class="layer-3d layer-3d-mid" transform="translate(-8, 8)">Erickxz6</text>
<text x="400" y="170" text-anchor="middle" class="layer-3d layer-3d-mid" transform="translate(-6, 6)">Erickxz6</text>

<text x="400" y="170" text-anchor="middle" class="layer-3d" transform="translate(-4, 4)">Erickxz6</text>
<text x="400" y="170" text-anchor="middle" class="layer-3d" transform="translate(-2, 2)">Erickxz6</text>

<!-- Cara frontal con gradiente que cambia de color y brillo neón -->
<text x="400" y="170" text-anchor="middle" class="glow-front">Erickxz6</text>

<!-- Subtítulo animado deslizando desde abajo -->
<g class="subtitle">
  <text x="400" y="240" text-anchor="middle">ESTUDIANTE DE <tspan class="subtitle-highlight">ANÁLISIS Y DESARROLLO DE SOFTWARE</tspan></text>
</g>

<!-- Una pequeña barra decorativa debajo del subtítulo -->
<rect x="350" y="270" width="100" height="4" rx="2" fill="#58a6ff" style="animation: fadeInSlide 2s ease-out forwards; opacity: 0;">
  <animate attributeName="width" values="0;100;0" dur="4s" repeatCount="indefinite" />
  <animate attributeName="x" values="400;350;400" dur="4s" repeatCount="indefinite" />
</rect>
