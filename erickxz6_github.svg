<!-- Gradiente para el texto secundario -->
<linearGradient id="subGradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#a8c0ff" />
  <stop offset="100%" stop-color="#3f2b96" />
</linearGradient>

<!-- CSS Integrado para las animaciones -->
<style>
  .bg { fill: #0d1117; }
  
  /* Animación principal de flotación */
  .floating {
    animation: float 6s ease-in-out infinite;
    transform-origin: center;
  }
  
  /* Animación de brillo neón */
  .glow-front {
    font-family: 'Segoe UI', Impact, Tahoma, sans-serif;
    font-size: 85px;
    font-weight: 900;
    fill: url(#neonGradient);
    animation: neon-pulse 3s ease-in-out infinite;
  }

  /* Estilos de las capas 3D traseras */
  .layer-3d {
    font-family: 'Segoe UI', Impact, Tahoma, sans-serif;
    font-size: 85px;
    font-weight: 900;
    fill: #1f6feb;
  }
  
  .layer-3d-dark { fill: #0f3b7d; }
  .layer-3d-mid { fill: #1653ad; }

  /* Estilo del subtítulo */
  .subtitle {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 19px;
    font-weight: 600;
    fill: #c9d1d9;
    letter-spacing: 3px;
    animation: fadeInSlide 2s ease-out forwards;
  }
  
  .subtitle-highlight { fill: #58a6ff; }

  /* Símbolos de código voladores en el fondo */
  .code-symbol {
    font-family: monospace;
    font-size: 24px;
    fill: #58a6ff;
    opacity: 0;
  }

  /* KEYFRAMES (La magia del movimiento) */
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-18px); }
    100% { transform: translateY(0px); }
  }

  @keyframes neon-pulse {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
    50% { filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.9)); }
  }

  @keyframes fadeInSlide {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0px); }
  }

  /* Animaciones independientes para los símbolos de fondo */
  @keyframes flyUp1 {
    0% { transform: translate(100px, 350px) rotate(0deg); opacity: 0; }
    20% { opacity: 0.15; }
    80% { opacity: 0.15; }
    100% { transform: translate(50px, -50px) rotate(180deg); opacity: 0; }
  }
  @keyframes flyUp2 {
    0% { transform: translate(650px, 350px) rotate(0deg); opacity: 0; }
    20% { opacity: 0.2; }
    80% { opacity: 0.2; }
    100% { transform: translate(700px, -50px) rotate(-180deg); opacity: 0; }
  }
  @keyframes flyUp3 {
    0% { transform: translate(250px, 400px) rotate(0deg); opacity: 0; }
    20% { opacity: 0.1; }
    80% { opacity: 0.1; }
    100% { transform: translate(350px, -50px) rotate(90deg); opacity: 0; }
  }
  @keyframes flyUp4 {
    0% { transform: translate(550px, 400px) rotate(0deg); opacity: 0; }
    20% { opacity: 0.15; }
    80% { opacity: 0.15; }
    100% { transform: translate(450px, -50px) rotate(-90deg); opacity: 0; }
  }
</style>


</>
